html/head_include="<style>
html, body { background: #05070f; }
#rotate-hint { display: none; position: fixed; inset: 0; z-index: 1000; background: #05070f; color: #f7c76b;
	font: 600 20px/1.4 sans-serif; text-align: center; align-items: center; justify-content: center;
	flex-direction: column; padding: 24px; }
@media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: flex; } }
</style>
<script>
// Telefon: po prvním dotyku přejde hra na celou obrazovku a zamkne se na šířku (Android).
// Kde to prohlížeč neumí (iPhone), ukáže se na výšku výzva k otočení telefonu.
(function () {
	document.addEventListener('DOMContentLoaded', function () {
		var hint = document.createElement('div');
		hint.id = 'rotate-hint';
		hint.innerHTML = '<div style=\"font-size:56px\">&#10227;</div><div>Otoč telefon na šířku</div>'
			+ '<div style=\"font-size:14px;opacity:.7;margin-top:8px\">Hra se pak roztáhne na celou obrazovku.</div>';
		document.body.appendChild(hint);
	});
	if (!window.matchMedia('(pointer: coarse)').matches) {
		return;
	}
	document.addEventListener('touchend', function () {
		var el = document.documentElement;
		var request = el.requestFullscreen || el.webkitRequestFullscreen;
		if (!request || document.fullscreenElement || document.webkitFullscreenElement) {
			return;
		}
		Promise.resolve(request.call(el)).then(function () {
			if (screen.orientation && screen.orientation.lock) {
				return screen.orientation.lock('landscape');
			}
		}).catch(function () {});
	}, { passive: true });
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
